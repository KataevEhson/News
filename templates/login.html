{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4">
</head>
<body>
    <div class="card">
        <h1>Вход</h1>
        <form method="post">
            {% csrf_token %}
            <input name="username" placeholder="Логин" required>
            <input name="password" type="password" placeholder="Пароль" required>
            <button>Войти</button>
        </form>
        <p>
            <a href="{% url 'registration' %}">Регистрация</a> · <a href="{% url 'confirm_email' %}">Подтвердить почту</a>
        </p>
    </div>
</body>
</html>
